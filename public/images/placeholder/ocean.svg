<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2500 1667" width="2500" height="1667" role="img" aria-label="">
  <title>Foundry placeholder — cold motion-blurred sea horizon</title>
  <desc>Brand-owned stand-in for the licensed hero photograph. Replace with the rights-cleared original.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="42%" stop-color="#16273d"/>
      <stop offset="58%" stop-color="#20364f"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c4a68" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#132436" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#02060c"/>
    </linearGradient>
    <filter id="drift" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.055" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0 9"/>
    </filter>
    <filter id="haze" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="14 3"/>
    </filter>
  </defs>
  <rect width="2500" height="1667" fill="url(#sky)"/>
  <rect y="742" width="2500" height="925" fill="url(#sea)"/>
  <g filter="url(#drift)" opacity="0.5">
    <rect y="700" width="2500" height="3" fill="#8fb4d6"/>
    <rect y="806" width="2500" height="5" fill="#6f96b8" opacity="0.8"/>
    <rect y="905" width="2500" height="7" fill="#5b809f" opacity="0.7"/>
    <rect y="1032" width="2500" height="9" fill="#48697f" opacity="0.6"/>
    <rect y="1188" width="2500" height="12" fill="#37536a" opacity="0.55"/>
    <rect y="1370" width="2500" height="16" fill="#263d52" opacity="0.5"/>
  </g>
  <rect y="726" width="2500" height="34" fill="#a9c6e0" opacity="0.32" filter="url(#haze)"/>
  <rect width="2500" height="1667" fill="#001848" opacity="0.15"/>
</svg>
